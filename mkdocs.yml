site_name: Multiwfn 官方手册
site_description: Multiwfn 官方手册中文翻译 + 英文原文（由 PDF 转换，共 1161 页，行间公式为 LaTeX）
site_author: PDF 转 Markdown + AI 翻译
site_url: https://wxyhgk.github.io/doc/multiwfn/
repo_url: https://github.com/wxyhgk/multiwfn-docs

docs_dir: docs
site_dir: site
use_directory_urls: false

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/lang-switch.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js

theme:
  name: material
  language: zh
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.tracking
    - search.suggest
    - search.highlight
    - content.code.copy

plugins:
  - search:
      lang: en

markdown_extensions:
  - toc:
      permalink: true
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.arithmatex:
      generic: true

